{% include demos/assets.html %}
<div class="bd" id="bdIsiPdf" role="group" aria-label="Interactive demo: the ISI distribution as a convolution of two-point distributions">
  <div class="bd-head"><span>// try it · ISI distribution</span>
    <span class="bd-seg" role="group" aria-label="Equalization"><button type="button" data-eq="none" aria-pressed="true">REF, no EQ</button><button type="button" data-eq="ffe" aria-pressed="false">REF + 2-tap TX FFE</button></span></div>
  <div class="bd-sliders">
    <label class="bd-sl"><span>cursors convolved (p<sub>−2</sub> … p<sub>N</sub>) <b data-v="n"></b></span><input type="range" data-k="n" min="1" max="150" step="1" value="150" aria-label="Number of post-cursors convolved"></label>
    <label class="bd-sl"><span>noise σ<sub>n</sub> <b data-v="sn"></b></span><input type="range" data-k="sn" min="0" max="10" step="0.1" value="1.5" aria-label="Noise rms in mV"></label>
  </div>
  <div class="bd-scope tall"><canvas data-c="p" aria-hidden="true"></canvas><span class="bd-tag">distribution of the received sample for a "1", log scale</span></div>
  <div class="bd-read" aria-live="polite"><span>patterns <b data-o="pat">–</b></span><span>"1"s below the threshold <b data-o="below">–</b></span><span>level at 10<sup>−12</sup> <b data-o="q12">–</b></span><span>PDA worst case <b data-o="pda">–</b></span></div>
  <p class="bd-caption" data-o="cap"></p>
</div>
<script>
(function () {
  var root = document.getElementById('bdIsiPdf'); if (!root || !window.BD || !window.SL) return;
  var A = 0.5, H = SL.channel(), p0 = SL.pulseOf(H), c00 = SL.cursors(p0, 2, 10), pF = SL.ffe(p0, SL.zfTaps(c00, 0, 1), 0), eq = 'none';
  var VMIN = -0.4, VMAX = 0.6, DV = 0.0002, NB = Math.round((VMAX - VMIN) / DV) + 1;
  var S = BD.bind(root, { n: { fmt: function (x) { return (x + 3) + ' cursors'; } }, sn: { fmt: function (x) { return x.toFixed(1) + ' mV rms'; } } }, function () { draw(); });
  BD.seg(root, 'eq', function (v) { eq = v; draw(); });
  var q = function (s) { return root.querySelector(s); };
  var mv = function (v) { return (v < 0 ? '−' : '') + Math.abs(v * 1e3).toFixed(0) + ' mV'; };
  function draw() {
    var p = eq === 'ffe' ? pF : p0, c = SL.cursors(p, 2, S.n), i0 = c.k.indexOf(0), main = A * c.v[i0];
    var pdf = new Float64Array(NB), x0 = Math.round((main - VMIN) / DV); pdf[x0] = 1;
    var spikes = [main];
    c.k.forEach(function (k, i) { if (k === 0) return; var s = A * c.v[i] / DV, si = Math.floor(s), fr = s - si, nw = new Float64Array(NB);
      for (var b = 0; b < NB; b++) { var v = pdf[b]; if (!v) continue; v *= 0.5;
        var u = b + si, l = b - si, a1 = v * (1 - fr), a2 = v * fr;
        if (u >= 0 && u < NB) nw[u] += a1; if (u + 1 >= 0 && u + 1 < NB) nw[u + 1] += a2;
        if (l >= 0 && l < NB) nw[l] += a1; if (l - 1 >= 0 && l - 1 < NB) nw[l - 1] += a2; }
      pdf = nw;
      if (spikes.length <= 32) { var ns = []; spikes.forEach(function (sv) { ns.push(sv + A * c.v[i], sv - A * c.v[i]); }); spikes = ns; } });
    var npat = Math.pow(2, c.k.length - 1);
    if (S.sn > 0) {                                   // Gaussian noise
      var sg = S.sn * 1e-3 / DV, R = Math.ceil(6 * sg), ker = [], ks = 0;
      for (var j = -R; j <= R; j++) { var w = Math.exp(-0.5 * j * j / (sg * sg)); ker.push(w); ks += w; }
      var out = new Float64Array(NB);
      for (var b2 = 0; b2 < NB; b2++) { var v2 = pdf[b2]; if (v2 < 1e-30) continue; for (j = -R; j <= R; j++) { var t2 = b2 + j; if (t2 >= 0 && t2 < NB) out[t2] += v2 * ker[j + R] / ks; } }
      pdf = out;
    }
    var cdf = 0, below = 0, q12 = null, zb = Math.round(-VMIN / DV);
    for (var b3 = 0; b3 < NB; b3++) { cdf += pdf[b3]; if (b3 === zb) below = cdf; if (q12 === null && cdf >= 1e-12) q12 = VMIN + b3 * DV; }
    var d = BD.setup(q('[data-c="p"]')), f = BD.frame(d, { x: [-0.3, 0.45], y: [1e-16, 1], ylog: true,
      xt: [[-0.2, '−200'], [-0.1, '−100'], [0, '0'], [0.1, '100'], [0.2, '200'], [0.3, '300'], [0.4, '400 mV']],
      yt: [[1, '1'], [1e-4, '1e−4'], [1e-8, '1e−8'], [1e-12, '1e−12'], [1e-16, '1e−16']], pad: { l: 46, t: 24 } });
    var g = d.g;
    if (npat <= 32 && S.sn === 0) {                  // few cursors: draw the individual spikes
      g.strokeStyle = BD.C.blue; g.lineWidth = 2; spikes.forEach(function (sv) { g.beginPath(); g.moveTo(f.X(sv), f.Y(1e-16)); g.lineTo(f.X(sv), f.Y(1 / spikes.length)); g.stroke(); });
    } else {
      var xs = [], ys = [], step = 5; for (b3 = 0; b3 < NB; b3 += step) { var s3 = 0; for (j = 0; j < step && b3 + j < NB; j++) s3 += pdf[b3 + j]; xs.push(VMIN + (b3 + step / 2) * DV); ys.push(s3 > 1e-17 ? s3 : NaN); }
      f.clipIn(); g.fillStyle = eq === 'ffe' ? 'rgba(127,208,184,.25)' : 'rgba(240,138,106,.22)'; g.beginPath(); g.moveTo(f.X(xs[0]), f.Y(1e-16));
      xs.forEach(function (x, i) { g.lineTo(f.X(x), f.Y(isFinite(ys[i]) ? ys[i] : 1e-16)); }); g.lineTo(f.X(xs[xs.length - 1]), f.Y(1e-16)); g.fill(); f.clipOut();
      BD.line(f, xs, ys, eq === 'ffe' ? BD.C.teal : BD.C.red, 1.6);
    }
    var pda = SL.pda(c) / 2;
    BD.vline(f, 0, 'rgba(255,255,255,.6)', [3, 3], 'threshold');
    BD.vline(f, pda, 'rgba(224,184,90,.8)', [5, 4]); g.fillStyle = BD.C.gold; g.fillText('PDA', f.X(pda) + 4, f.p.t + 24);
    q('[data-o="pat"]').textContent = npat > 1e6 ? '2^' + (c.k.length - 1) : npat.toLocaleString('en');
    var be = q('[data-o="below"]'); be.textContent = below < 1e-15 ? '< 1e−15' : below > 1e-3 ? (100 * below).toFixed(1) + ' %' : below.toExponential(1); be.className = below < 1e-12 ? 'ok' : 'bad';
    q('[data-o="q12"]').textContent = q12 === null ? '–' : mv(q12);
    q('[data-o="pda"]').textContent = mv(pda);
    q('[data-o="cap"]').innerHTML = (npat <= 32 && S.sn === 0
      ? 'Each cursor adds ±A·p<sub>k</sub> with equal probability, so it splits every spike in two: ' + npat + ' patterns. Add more cursors and the spikes merge into a distribution. '
      : 'With all the cursors the spikes merge into a smooth distribution, and noise blurs its edges. ') +
      (eq === 'none' ? 'Unequalized, ' + (100 * below).toFixed(1) + ' % of all "1"s fall below the threshold: REF is closed for most patterns, not just the worst one.'
       : 'With the 2-tap FFE the distribution ends at ' + (q12 === null ? '–' : mv(q12)) + ' at 10<sup>−12</sup>, just inside the PDA worst case: the statistical eye is only slightly more optimistic than PDA, because the worst patterns are not that rare.');
  }
  BD.observe(root, draw);
})();
</script>
