<div class="bd" id="bdTline" role="group" aria-label="Interactive demo: when a wire becomes a transmission line">
  <div class="bd-head"><span>// try it · when is a wire a transmission line?</span><span>Z<sub>0</sub> = 50 Ω</span></div>
  <div class="bd-sliders">
    <label class="bd-sl"><span>edge rise time t<sub>r</sub> <b data-v="tr"></b></span><input type="range" data-k="tr" min="5" max="500" step="1" value="50" aria-label="Rise time in ps"></label>
    <label class="bd-sl"><span>dielectric constant ε<sub>r</sub> <b data-v="er"></b></span><input type="range" data-k="er" min="1" max="12" step="0.1" value="4" aria-label="Dielectric constant"></label>
    <label class="bd-sl"><span>trace length <b data-v="len"></b></span><input type="range" data-k="len" min="0.1" max="50" step="0.1" value="10" aria-label="Trace length in mm"></label>
  </div>
  <div class="bd-scope short"><canvas data-c="t" aria-hidden="true"></canvas><span class="bd-tag">trace length against the t<sub>r</sub>v/6 limit (log scale)</span></div>
  <div class="bd-read" aria-live="polite"><span>v <b data-o="v">–</b></span><span>delay <b data-o="d">–</b></span><span>limit t<sub>r</sub>v/6 <b data-o="lim">–</b></span><span>L, C per metre <b data-o="lc">–</b></span><span>this trace <b data-o="vd">–</b></span></div>
  <p class="bd-caption" data-o="cap"></p>
</div>
<script>
(function () {
  var root = document.getElementById('bdTline'); if (!root || !window.BD) return;
  var S = BD.bind(root, { tr: { fmt: function (x) { return x + ' ps'; } }, er: { fmt: function (x) { return x.toFixed(1); } }, len: { fmt: function (x) { return x.toFixed(1) + ' mm'; } } }, function () { draw(); });
  var q = function (s) { return root.querySelector(s); };
  function draw() {
    var v = 2.998e8 / Math.sqrt(S.er), lim = S.tr * 1e-12 * v / 6 * 1e3, dly = 1e12 / v / 1e3, L = 50 / v, C = 1 / (50 * v), isTL = S.len > lim;
    var d = BD.setup(q('[data-c="t"]')), f = BD.frame(d, { x: [0.1, 100], y: [0, 1], xlog: true, xt: [[0.1, '0.1'], [1, '1'], [10, '10'], [100, '100 mm']], yt: [], pad: { l: 20, t: 18, b: 22 } });
    var g = d.g; g.fillStyle = 'rgba(127,224,160,.10)'; g.fillRect(f.X(0.1), f.Y(1), f.X(lim) - f.X(0.1), f.Y(0) - f.Y(1));
    g.fillStyle = 'rgba(240,138,106,.10)'; g.fillRect(f.X(lim), f.Y(1), f.X(100) - f.X(lim), f.Y(0) - f.Y(1));
    g.fillStyle = BD.C.green; g.fillText('lumped wire', f.X(0.12), f.Y(0.85)); g.fillStyle = BD.C.red; g.textAlign = 'right'; g.fillText('transmission line', f.X(95), f.Y(0.85)); g.textAlign = 'left';
    BD.vline(f, lim, BD.C.gold, [4, 3], 't_r v/6');
    g.fillStyle = isTL ? BD.C.red : BD.C.green; g.fillRect(f.X(0.1), f.Y(0.45), f.X(S.len) - f.X(0.1), 10);
    q('[data-o="v"]').textContent = (v / 1e8).toFixed(2) + '×10⁸ m/s';
    q('[data-o="d"]').textContent = dly.toFixed(2) + ' ps/mm';
    q('[data-o="lim"]').textContent = lim.toFixed(2) + ' mm';
    q('[data-o="lc"]').textContent = (L * 1e9).toFixed(0) + ' nH, ' + (C * 1e12).toFixed(0) + ' pF';
    var e = q('[data-o="vd"]'); e.textContent = isTL ? 'transmission line' : 'lumped'; e.className = isTL ? 'bad' : 'ok';
    q('[data-o="cap"]').innerHTML = 'A trace must be treated as a transmission line once its delay is a sizeable fraction of the edge: beyond about t<sub>r</sub>v/6. ' +
      'For a 50 ps CML edge on FR-4 that is only ' + (50e-12 * 2.998e8 / 2 / 6 * 1e3).toFixed(2) + ' mm, so everything off-chip, and the longest on-chip routes, must be terminated and impedance-controlled. One metre of REF takes ' + (dly).toFixed(2) + ' ns: ' + (dly * 1000 / 200).toFixed(1) + ' UI in flight.';
  }
  BD.observe(root, draw);
})();
</script>
