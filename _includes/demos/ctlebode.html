<div class="bd" id="bdCtleBode" role="group" aria-label="Interactive demo: degenerated-pair CTLE, from components to boost">
  <div class="bd-head"><span>// try it · CTLE pole-zero designer</span>
    <span class="bd-seg" role="group" aria-label="Designs"><button type="button" data-d="20,401,0.795,50,318" aria-pressed="true">Ex 7.1 (Lab 4)</button><button type="button" data-d="38.7,112,1.8,200,100" aria-pressed="false">Ex 7.2 HBT</button><button type="button" data-d="38.7,317,0.72,200,100" aria-pressed="false">Ex 7.2 fixed</button></span></div>
  <div class="bd-sliders">
    <label class="bd-sl"><span>g<sub>m</sub> per side <b data-v="gm"></b></span><input type="range" data-k="gm" min="5" max="80" step="0.1" value="20" aria-label="Transconductance in mS"></label>
    <label class="bd-sl"><span>R<sub>S</sub> (degeneration) <b data-v="rs"></b></span><input type="range" data-k="rs" min="0" max="1000" step="1" value="401" aria-label="Degeneration resistor in ohms"></label>
    <label class="bd-sl"><span>C<sub>S</sub> <b data-v="cs"></b></span><input type="range" data-k="cs" min="0.1" max="4" step="0.005" value="0.795" aria-label="Degeneration capacitor in pF"></label>
    <label class="bd-sl"><span>R<sub>D</sub> (load) <b data-v="rd"></b></span><input type="range" data-k="rd" min="20" max="400" step="1" value="50" aria-label="Load resistor in ohms"></label>
    <label class="bd-sl"><span>C<sub>L</sub> <b data-v="cl"></b></span><input type="range" data-k="cl" min="20" max="600" step="1" value="318" aria-label="Load capacitance in fF"></label>
  </div>
  <div class="bd-scope tall"><canvas data-c="b" aria-hidden="true"></canvas><span class="bd-tag">|H(f)|, dB: response (blue) and its asymptotes (dashed); f<sub>N</sub> = 2.5 GHz</span></div>
  <div class="bd-read" aria-live="polite"><span>DC gain <b data-o="dc">–</b></span><span>ideal peaking 1 + g<sub>m</sub>R<sub>S</sub>/2 <b data-o="ip">–</b></span><span>|H(f<sub>N</sub>)| <b data-o="hn">–</b></span><span>boost realized at f<sub>N</sub> <b data-o="rb">–</b></span><span>f<sub>z</sub>, f<sub>p1</sub>, f<sub>p2</sub> <b data-o="pz">–</b></span><span>peak at <b data-o="pk">–</b></span></div>
  <p class="bd-caption" data-o="cap"></p>
</div>
<script>
(function () {
  var root = document.getElementById('bdCtleBode'); if (!root || !window.BD) return;
  var S = BD.bind(root, { gm: { fmt: function (x) { return x.toFixed(1) + ' mS'; } }, rs: { fmt: function (x) { return x.toFixed(0) + ' Ω'; } }, cs: { fmt: function (x) { return x.toFixed(3) + ' pF'; } },
    rd: { fmt: function (x) { return x.toFixed(0) + ' Ω'; } }, cl: { fmt: function (x) { return x.toFixed(0) + ' fF'; } } }, function () { draw(); });
  var q = function (s) { return root.querySelector(s); }, keys = ['gm', 'rs', 'cs', 'rd', 'cl'];
  root.querySelectorAll('[data-d]').forEach(function (b) { b.addEventListener('click', function () { var t = b.getAttribute('data-d').split(',');
    keys.forEach(function (k, i) { q('[data-k="' + k + '"]').value = t[i]; q('[data-k="' + k + '"]').dispatchEvent(new Event('input')); }); }); });
  var db = function (x) { return 20 * Math.log10(x); };
  function draw() {
    var gm = S.gm * 1e-3, rs = S.rs, cs = S.cs * 1e-12, rd = S.rd, cl = S.cl * 1e-15;
    root.querySelectorAll('[data-d]').forEach(function (b) { var t = b.getAttribute('data-d').split(',').map(Number), on = true;
      [S.gm, S.rs, S.cs, S.rd, S.cl].forEach(function (v, i) { if (Math.abs(v - t[i]) > 1e-6 + 0.002 * t[i]) on = false; }); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    var a = 1 + gm * rs / 2, fz = rs > 0 ? 1 / (2 * Math.PI * rs * cs) : 1e30, fp1 = a * fz, fp2 = 1 / (2 * Math.PI * rd * cl), k0 = gm * rd / a;
    var H = function (f) { var x = f / fz, y1 = f / fp1, y2 = f / fp2; return k0 * Math.hypot(1, x) / (Math.hypot(1, y1) * Math.hypot(1, y2)); };
    var xs = [], ys = [], as = [], pk = 0, pf = 0;
    for (var i = 0; i <= 300; i++) { var f = 1e8 * Math.pow(1000, i / 300), h = H(f); xs.push(f / 1e9); ys.push(db(h)); if (h > pk) { pk = h; pf = f; }
      var asy = k0 * Math.max(1, f / fz) / (Math.max(1, f / fp1) * Math.max(1, f / fp2)); as.push(db(asy)); }
    var lo = Math.min(db(k0), Math.min.apply(null, ys.slice(-1))) - 6, hi = Math.max(db(pk), db(gm * rd)) + 4;
    var d = BD.setup(q('[data-c="b"]')), fr = BD.frame(d, { x: [0.1, 100], y: [lo, hi], xlog: true, xt: [[0.1, '0.1'], [1, '1'], [2.5, 'f_N'], [10, '10'], [100, '100 GHz']],
      yt: [Math.ceil(lo / 5) * 5, Math.round((lo + hi) / 10) * 5, Math.floor(hi / 5) * 5].map(function (v) { return [v, v + ' dB']; }), pad: { l: 50, t: 24 } });
    BD.line(fr, xs, as, 'rgba(224,184,90,.55)', 1.2, [5, 4]); BD.line(fr, xs, ys, BD.C.blue, 2.2);
    [[fz, 'f_z'], [fp1, 'f_p1'], [fp2, 'f_p2']].forEach(function (p) { if (p[0] < 1e11 && p[0] > 1e8) BD.vline(fr, p[0] / 1e9, 'rgba(170,205,240,.35)', [2, 3], p[1]); });
    var hn = H(2.5e9); BD.dot(fr, 2.5, db(hn), BD.C.gold, 4.5);
    q('[data-o="dc"]').textContent = db(k0).toFixed(1) + ' dB';
    q('[data-o="ip"]').textContent = db(a).toFixed(1) + ' dB';
    q('[data-o="hn"]').textContent = db(hn).toFixed(1) + ' dB';
    var rb = db(hn / k0), re = q('[data-o="rb"]'); re.textContent = rb.toFixed(1) + ' dB'; re.className = db(a) - rb > 3 ? 'bad' : 'ok';
    var g = function (f) { return f >= 1e9 ? (f / 1e9).toFixed(2) + ' G' : (f / 1e6).toFixed(0) + ' M'; };
    q('[data-o="pz"]').textContent = g(fz) + ', ' + g(fp1) + ', ' + g(fp2);
    q('[data-o="pk"]').textContent = (pf / 1e9).toFixed(1) + ' GHz';
    q('[data-o="cap"]').innerHTML = 'R<sub>S</sub> sets the ideal peaking 1 + g<sub>m</sub>R<sub>S</sub>/2 (and lowers the DC gain by the same factor); C<sub>S</sub> slides the zero and the first pole together; R<sub>D</sub>C<sub>L</sub> sets the second pole. ' +
      'The asymptotes promise ' + db(a).toFixed(1) + ' dB, but at f<sub>N</sub> only ' + rb.toFixed(1) + ' dB is realized: ' + (fp1 < 4e9 ? 'the first pole sits close to f<sub>N</sub> and already costs about 3 dB there. Move f<sub>p1</sub> up to 2f<sub>N</sub> and the zero down to recover it (the "fixed" preset).' : 'the zero sits well below f<sub>N</sub> and the poles are out of the way.');
  }
  BD.observe(root, draw);
})();
</script>
