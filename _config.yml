title: "Open-SERDES Tutorial"
description: >-
  Designing a Serial Link from Scratch: an open design tutorial for undergraduate engineers
  building a 5 Gb/s SerDes in the IHP SG13G2 130 nm SiGe BiCMOS open PDK. By BRICD.

theme: just-the-docs

# Served by the bricd-org GitHub Pages site (custom domain www.thebricd.org).
# The Pages workflow passes the real base path, so these only matter for local builds.
url: https://www.thebricd.org
baseurl: /serdes-tutorial

logo: "/assets/images/bricd-logo.png"
favicon_ico: "/favicon.ico"
color_scheme: bricd

aux_links:
  "Download the PDF":
    - "https://www.thebricd.org/serdes-tutorial/assets/pdf/Open-SERDES_Tutorial.pdf"
  "GitHub":
    - "https://github.com/bricd-org/serdes-tutorial"
  "BRICD":
    - "https://www.thebricd.org"
aux_links_new_tab: false

nav_external_links:
  - title: Download the PDF (161 pages)
    url: https://www.thebricd.org/serdes-tutorial/assets/pdf/Open-SERDES_Tutorial.pdf
    hide_icon: false
  - title: Source on GitHub
    url: https://github.com/bricd-org/serdes-tutorial

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Pages are generated from the LaTeX book by tools/build_site.py, so edit the LaTeX,
# not the HTML. The edit link points at the book sources instead.
gh_edit_link: false
gh_edit_link_text: "View the LaTeX source of this book on GitHub."
gh_edit_repository: "https://github.com/bricd-org/serdes-tutorial"
gh_edit_branch: "main"
gh_edit_source: book
gh_edit_view_mode: "tree"

last_edit_timestamp: false
enable_copy_code_button: true

compress_html:
  ignore:
    envs: all

kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - book/
  - tools/
  - README.md
  - LICENSE*
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
